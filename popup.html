<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<style>
  body {
    margin: 0;
    width: 260px;
    background: #0c0d11;
    color: #e9e9ee;
    font-family: "Segoe UI", Roboto, -apple-system, sans-serif;
    padding: 16px;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 8px;
    background: linear-gradient(90deg, #f5c94a, #f2a93a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { font-size: 12px; color: #b8bacb; line-height: 1.5; }
  button {
    width: 100%;
    margin-top: 8px;
    background: linear-gradient(90deg, #f5c94a, #f2a93a);
    border: none;
    color: #16171c;
    font-weight: 700;
    font-size: 12px;
    padding: 9px;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>FACEIT Tactics Assistant</h1>
  <p>Открой страницу комнаты матча CS2 на faceit.com — панель с тактиками и статистикой появится справа автоматически.</p>
  <button id="openOptions">Настройки / API-ключ</button>
  <script src="popup.js"></script>
</body>
</html>
